    // Firebase compat configuration
    let db;
    try {
      const firebaseConfig = {
        apiKey: "AIzaSyD-EE4pIw9rD4tZmz9tKnzsd6VQzhC3ck0",
        authDomain: "cngpi-edu.firebaseapp.com",
        projectId: "cngpi-edu",
        storageBucket: "cngpi-edu.firebasestorage.app",
        messagingSenderId: "889275125335",
        appId: "1:889275125335:web:a3e8a944d1a2d429501d12"
      };

      if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
      } else {
        console.warn("Firebase SDK not loaded. Books page running in offline fallback mode.");
      }
    } catch (e) {
      console.error("Firebase init failed in books:", e);
    }

    let activeTechnology = "";
    let loadedBooksData = {};

    function renderTechTabs() {
      const container = document.getElementById("tech-tabs-container");
      if (!container) return;
      container.innerHTML = "";

      Object.keys(loadedBooksData).forEach(techId => {
        const data = loadedBooksData[techId];
        const label = data.technology_name || techId;

        const button = document.createElement("button");
        if (techId === activeTechnology) {
          button.className = "snap-center shrink-0 px-4 py-2.5 bg-brand-500 text-white text-xs font-extrabold rounded-xl shadow-md transition-all shadow-brand-500/10";
        } else {
          button.className = "snap-center shrink-0 px-4 py-2.5 bg-slate-100 text-slate-500 text-xs font-bold rounded-xl border border-slate-200/40 hover:bg-slate-200/50 active:scale-[0.98] transition-all";
        }
        button.innerHTML = `<span>${label}</span>`;
        button.onclick = () => {
          activeTechnology = techId;
          renderTechTabs();
          renderAccordions();
        };
        container.appendChild(button);
      });
    }

    function getOrdinalSuffix(i) {
      const j = i % 10, k = i % 100;
      if (j === 1 && k !== 11) return "st";
      if (j === 2 && k !== 12) return "nd";
      if (j === 3 && k !== 13) return "rd";
      return "th";
    }

    function renderAccordions() {
      const container = document.getElementById("semesters-accordion");
      if (!container) return;
      container.innerHTML = "";
      
      if (!activeTechnology) {
        container.innerHTML = `<div class="text-xs text-slate-400 py-6 text-center">No technologies loaded.</div>`;
        return;
      }

      const techData = loadedBooksData[activeTechnology] || defaultBooksData[activeTechnology] || { semesters: {} };

      for (let sem = 1; sem <= 8; sem++) {
        const booksList = (techData.semesters && techData.semesters[sem.toString()]) || [];
        const isLastSem = sem === 8;

        const accordion = document.createElement("div");
        accordion.className = "bg-white border border-slate-200/80 rounded-2xl overflow-hidden shadow-sm transition-all duration-300";
        
        let booksHtml = "";
        if (booksList.length === 0) {
          booksHtml = `<div class="text-xs text-slate-400 py-3 text-center">No textbooks added for this semester yet.</div>`;
        } else {
          booksList.forEach(b => {
            booksHtml += `
              <div class="flex items-center justify-between py-3 border-b border-slate-100 last:border-b-0">
                <div class="text-left max-w-[260px]">
                  <h4 class="text-xs font-bold text-slate-800 leading-tight">${b.name}</h4>
                  <span class="text-[9px] font-semibold text-slate-400 mt-0.5 block">Textbook</span>
                </div>
                <div class="shrink-0 flex items-center gap-1.5 bg-slate-50 border border-slate-200 px-2.5 py-1 rounded-lg">
                  <i data-lucide="hash" class="w-3 h-3 text-brand-500"></i>
                  <span class="font-mono text-[10px] font-bold text-slate-600">${b.code}</span>
                </div>
              </div>
            `;
          });
        }

        accordion.innerHTML = `
          <button class="w-full flex items-center justify-between p-4 focus:outline-none" onclick="toggleAccordion(this)">
            <div class="flex items-center gap-2.5">
              <div class="w-7 h-7 rounded-lg bg-brand-50 border border-brand-100/50 flex items-center justify-center">
                <span class="text-xs font-black text-brand-500 font-display">${sem}</span>
              </div>
              <h3 class="font-bold text-xs text-slate-800 font-display">${sem}${getOrdinalSuffix(sem)} Semester Book List</h3>
            </div>
            <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 transform transition-transform duration-200"></i>
          </button>
          <div class="accordion-content hidden px-4 pb-4 transition-all">
            ${booksHtml}
          </div>
        `;
        container.appendChild(accordion);
      }
      lucide.createIcons();
    }

    function toggleAccordion(button) {
      const content = button.nextElementSibling;
      const icon = button.querySelector('i[data-lucide="chevron-down"]');
      content.classList.toggle("hidden");
      if (content.classList.contains("hidden")) {
        if (icon) icon.style.transform = "rotate(0deg)";
      } else {
        if (icon) icon.style.transform = "rotate(180deg)";
      }
    }

    // Load from Firestore with automatic local fallback
    function loadBooksData() {
      if (typeof db === 'undefined' || !db) {
        console.warn("Database offline. Running in local fallback mode.");
        loadedBooksData = JSON.parse(JSON.stringify(defaultBooksData));
        const techKeys = Object.keys(loadedBooksData);
        activeTechnology = techKeys.includes("CST") ? "CST" : techKeys[0];
        renderTechTabs();
        renderAccordions();
        return;
      }
      // Real-time Firebase Datastore listener for instant live updates
      db.collection("books").onSnapshot((querySnap) => {
        // Start with default books data (ET, CST) so default list is preserved
        loadedBooksData = JSON.parse(JSON.stringify(defaultBooksData));

        if (!querySnap.empty) {
          querySnap.forEach((doc) => {
            loadedBooksData[doc.id] = doc.data();
          });
        } else {
          console.log("No custom books found in Firestore. Seeding default scraped list...");
          seedBooksData();
        }

        const techKeys = Object.keys(loadedBooksData);
        if (!activeTechnology || !techKeys.includes(activeTechnology)) {
          activeTechnology = techKeys.includes("CST") ? "CST" : techKeys[0];
        }

        renderTechTabs();
        renderAccordions();
      }, err => {
        console.error("Firestore real-time books listener error:", err);
        loadedBooksData = JSON.parse(JSON.stringify(defaultBooksData));
        activeTechnology = "CST";
        renderTechTabs();
        renderAccordions();
      });
    }

    // Seeding books collection
    function seedBooksData() {
      if (typeof db === 'undefined' || !db) return;
      const batch = db.batch();
      Object.keys(defaultBooksData).forEach(techId => {
        const docRef = db.collection("books").doc(techId);
        batch.set(docRef, defaultBooksData[techId]);
      });
      batch.commit().then(() => {
        console.log("Database seeded with scraped book list.");
        loadBooksData();
      }).catch(err => console.error("Database seeding failed:", err));
    }

    window.onload = function() {
      loadBooksData();
      lucide.createIcons();
    };
