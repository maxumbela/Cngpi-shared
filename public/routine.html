<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Class Routine | Chapainawabganj Polytechnic Institute</title>
  <meta name="description" content="View weekly class timetable, period schedules, room numbers, and teacher directory for CNGPI.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>

  <!-- HTML2Canvas for exporting image -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --font-primary: 'Inter', sans-serif;
      --font-display: 'Outfit', sans-serif;
      
      --bg-dark: #090d16;
      --bg-card: rgba(18, 26, 43, 0.75);
      --bg-card-hover: rgba(30, 41, 65, 0.85);
      --bg-nav: rgba(13, 19, 33, 0.92);
      
      --border-color: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(99, 102, 241, 0.3);
      
      --color-primary: #6366f1;
      --color-purple: #a855f7;
      --color-cyan: #06b6d4;
      --color-emerald: #10b981;
      --color-amber: #f59e0b;
      --color-rose: #f43f5e;
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      --grad-primary: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --grad-routine: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      --grad-emerald: linear-gradient(135deg, #10b981 0%, #059669 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: var(--font-primary);
      background: var(--bg-dark);
      color: var(--text-main);
    }

    /* Ambient Background Glows */
    .bg-glow-top {
      position: fixed;
      top: -15%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
      filter: blur(90px);
      z-index: 0;
      pointer-events: none;
    }

    .bg-glow-bottom {
      position: fixed;
      bottom: -15%;
      right: 10%;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
      filter: blur(100px);
      z-index: 0;
      pointer-events: none;
    }

    /* Responsive Container */
    .web-app-container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
      padding-bottom: 90px;
    }

    /* App Header */
    .app-header {
      padding: 18px 20px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: rgba(9, 13, 22, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-back {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-back:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .header-title-group h1 {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-title-group p {
      font-size: 11px;
      color: var(--text-muted);
    }

    .cngpi-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #818cf8;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }

    /* Content Wrapper */
    .content-wrapper {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Group Selector & Header Card */
    .routine-header-card {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(168, 85, 247, 0.1) 100%);
      border: 1px solid var(--border-accent);
      border-radius: 22px;
      padding: 20px;
      backdrop-filter: blur(16px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
    }

    .selector-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .group-select-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .group-dropdown {
      background: rgba(10, 15, 26, 0.9);
      border: 1px solid var(--border-accent);
      border-radius: 12px;
      padding: 8px 14px;
      color: #ffffff;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 800;
      outline: none;
      cursor: pointer;
    }

    .group-dropdown option {
      background: #090d16;
      color: #ffffff;
    }

    .routine-info-title {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .routine-info-sub {
      font-size: 13px;
      color: #a5b4fc;
      margin-bottom: 12px;
    }

    .routine-meta-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .meta-tag {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 10px;
      border-radius: 8px;
    }

    .meta-tag i {
      color: #818cf8;
    }

    /* Day Selector Tabs */
    .day-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .day-tabs::-webkit-scrollbar {
      display: none;
    }

    .day-tab-btn {
      flex: 1;
      min-width: 80px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(18, 26, 43, 0.6);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.25s ease;
    }

    .day-tab-btn:hover {
      background: rgba(30, 41, 65, 0.8);
      color: var(--text-main);
    }

    .day-tab-btn.active {
      background: var(--grad-routine);
      color: #ffffff;
      border-color: rgba(99, 102, 241, 0.4);
      box-shadow: 0 6px 18px rgba(99, 102, 241, 0.3);
    }

    .day-tab-btn.today::after {
      content: '• Today';
      display: block;
      font-size: 9px;
      color: #34d399;
      font-weight: 600;
      margin-top: 2px;
    }

    /* Class Period Cards List */
    .period-cards-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .period-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 16px;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: all 0.25s ease;
    }

    .period-card.off-period {
      opacity: 0.6;
      border-style: dashed;
    }

    .period-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .period-time-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #818cf8;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.25);
      padding: 4px 10px;
      border-radius: 8px;
    }

    .room-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      color: #34d399;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 4px 10px;
      border-radius: 8px;
    }

    .subject-title {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.3;
    }

    .subject-code-tag {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .period-teacher-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 12px;
    }

    .teacher-code-name {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
      font-weight: 600;
    }

    .teacher-avatar-mini {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      background: var(--grad-primary);
      color: #ffffff;
      font-size: 10px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Teacher Directory Section */
    .teachers-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 20px;
      backdrop-filter: blur(12px);
    }

    .section-header-title {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .teacher-card-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(10, 15, 26, 0.5);
      border: 1px solid var(--border-color);
      margin-bottom: 10px;
    }

    .teacher-card-item:last-child {
      margin-bottom: 0;
    }

    .teacher-info-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .teacher-avatar-big {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(168, 85, 247, 0.2) 100%);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a855f7;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .teacher-name-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .class-teacher-pill {
      font-size: 9px;
      font-weight: 800;
      color: #34d399;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 6px;
      border-radius: 6px;
    }

    .teacher-desig {
      font-size: 11px;
      color: var(--text-muted);
    }

    .btn-call-teacher {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-call-teacher:hover {
      background: rgba(16, 185, 129, 0.25);
    }

    /* Fixed Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 600px;
      height: 70px;
      background: var(--bg-nav);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-color);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      z-index: 1000;
      padding: 0 10px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--text-muted);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .nav-item:hover, .nav-item.active {
      color: var(--color-primary);
    }

    .nav-icon-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 28px;
      border-radius: 12px;
      transition: all 0.25s ease;
    }

    .nav-item.active .nav-icon-wrapper {
      background: rgba(99, 102, 241, 0.15);
    }

    .nav-label {
      font-size: 10px;
      font-weight: 600;
    }
  </style>
</head>

  <!-- Ambient Glows -->
  <div class="bg-glow-top"></div>
  <div class="bg-glow-bottom"></div>

  <main class="web-app-container">

    <!-- Header Navigation -->
    <header class="app-header">
      <div class="header-left">
        <a href="index.html" class="btn-back" title="Back to Portal">
          <i data-lucide="arrow-left" style="width: 20px; height: 20px;"></i>

        <div class="header-title-group">
          <h1>Class Routine</h1>
          <p>Chapainawabganj Polytechnic</p>

      <div class="cngpi-badge">
        <i data-lucide="calendar" style="width: 14px; height: 14px;"></i>

    <div class="content-wrapper">

      <!-- Routine Header Card & Group Selector -->
      <div class="routine-header-card">
        <div class="selector-row">
          <div class="group-select-label">
            <i data-lucide="users" style="width: 14px; height: 14px;"></i>
            <span>Select Group Code</span>
          </div>
          <select id="group-select-dropdown" class="group-dropdown" onchange="onGroupSelected(this.value)">
            <option value="cst_7_2">CST 7/2</option>
          </select>
        </div>

        <h2 class="routine-info-title" id="info-group-title">CST 7/2</h2>
        <div class="routine-info-sub" id="info-dept-sem">Computer Science & Technology (Second Shift) • Seventh Semester</div>

        <div class="routine-meta-row">
          <div class="meta-tag">
            <i data-lucide="clock" style="width: 13px; height: 13px;"></i>
            <span id="info-load-tag">Total Load: 26 Periods/Week</span>
          </div>
          <div class="meta-tag">
            <i data-lucide="building" style="width: 13px; height: 13px;"></i>
            <span>CNGPI Academic Building</span>
          </div>
        </div>
      </div>

      <!-- Weekly Schedule Day Tabs -->
      <div class="day-tabs" id="day-tabs-container">
        <button class="day-tab-btn active" id="day-btn-Sunday" onclick="switchDayTab('Sunday')">Sunday</button>
        <button class="day-tab-btn" id="day-btn-Monday" onclick="switchDayTab('Monday')">Monday</button>
        <button class="day-tab-btn" id="day-btn-Tuesday" onclick="switchDayTab('Tuesday')">Tuesday</button>
        <button class="day-tab-btn" id="day-btn-Wednesday" onclick="switchDayTab('Wednesday')">Wednesday</button>
        <button class="day-tab-btn" id="day-btn-Thursday" onclick="switchDayTab('Thursday')">Thursday</button>
      </div>

      <!-- Period Cards Container -->
      <div class="period-cards-list" id="period-cards-container">
        <!-- Rendered dynamically -->
      </div>

      <!-- Teachers Directory Card -->
      <div class="teachers-section">
        <div class="section-header-title">
          <i data-lucide="user-check" style="width: 18px; height: 18px; color: #a855f7;"></i>
          <span>Department Teachers Directory</span>
        </div>
        <div id="teachers-list-container">
          <!-- Rendered dynamically -->
        </div>
      </div>

    </div>

    <!-- Fixed Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item">
        <div class="nav-icon-wrapper">
          <i data-lucide="home" style="width: 20px; height: 20px;"></i>
        </div>
        <span class="nav-label">Home</span>
      </a>

      <a href="routine.html" class="nav-item active">
        <div class="nav-icon-wrapper">
          <i data-lucide="calendar-days" style="width: 20px; height: 20px;"></i>
        </div>
        <span class="nav-label">Routine</span>
      </a>

      <a href="index.html" class="nav-item">
        <div class="nav-icon-wrapper">
          <i data-lucide="award" style="width: 20px; height: 20px;"></i>
        </div>
        <span class="nav-label">Result</span>
      </a>

      <a href="calculator.html" class="nav-item">
        <div class="nav-icon-wrapper">
          <i data-lucide="calculator" style="width: 20px; height: 20px;"></i>
        </div>
        <span class="nav-label">CGPA</span>
      </a>

      <a href="index.html" class="nav-item">
        <div class="nav-icon-wrapper">
          <i data-lucide="book-open" style="width: 20px; height: 20px;"></i>
        </div>
        <span class="nav-label">Book List</span>
      </a>
    </nav>

  </main>

        "Thursday": [
          { period: "1st", time: "1:30PM-2:15PM", subject_name: "Digital Marketing Technique", subject_code: "28571", teacher_short_code: "KA", room: "S-418" },
          { period: "2nd & 3rd", time: "2:15PM-3:45PM", subject_name: "Network Administration & Services", subject_code: "28572", teacher_short_code: "JR", room: "Hardware Lab" },
          { period: "4th", time: "3:45PM-4:30PM", subject_name: "Apps Development Project", subject_code: "28574", teacher_short_code: "IH", room: "S-418" },
          { period: "5th", time: "4:30PM-5:15PM", subject_name: "Multimedia & Animation", subject_code: "28575", teacher_short_code: "ZI", room: "S-418" }
        ]
      },
      teachers_details: [
        { short_code: "JR", name: "Md. Jewel Rana", designation: "Instructor (Tech/Computer)", phone_no: "01732755176", role: "Class Teacher" },
        { short_code: "HA", name: "Hakimin Ahmed", designation: "Part-Time Teacher (Electronics)", phone_no: "01759731841", role: null },
        { short_code: "AbM", name: "Md. Abdul Malek", designation: "Instructor (Tech/Computer)", phone_no: "01314851894", role: null },
        { short_code: "IH", name: "Md. Idul Hasan Jony", designation: "Part-Time Teacher (Computer)", phone_no: "01791008770", role: null },
        { short_code: "KA", name: "Md. Kausar Ali", designation: "Jr. Instructor (Tech/Computer)", phone_no: "01753038380", role: null },
        { short_code: "ZI", name: "ZAHIDUL ISLAM", designation: "Jr. Instructor (Tech/Computer)", phone_no: "01738628365", role: null }
      ]
    };

    let db;
    let loadedRoutines = {};
    let activeGroupCode = "cst_7_2";
    let activeDay = "Sunday";

    // Firebase Setup
    try {
      const firebaseConfig = {
        apiKey: "AIzaSyD-EE4pIw9rD4tZmz9tKnzsd6VQzhC3ck0",
        authDomain: "cngpi-edu.firebaseapp.com",
        projectId: "cngpi-edu",
        storageBucket: "cngpi-edu.firebasestorage.app",
        messagingSenderId: "889275125335",
        appId: "1:889275125335:web:a3e8a944d1a2d429501d12"
      };

      if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
      }
    } catch (e) {
      console.log("Firebase init notice:", e);
    }

    // On Load Lifecycle
    document.addEventListener("DOMContentLoaded", () => {
      determineTodayTab();
      fetchGroupRoutinesFromFirestore();
    });

    // Auto Highlight Today's Tab
    function determineTodayTab() {
      const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday"];
      const dayNamesMap = { 0: "Sunday", 1: "Monday", 2: "Tuesday", 3: "Wednesday", 4: "Thursday" };
      const currentDayIdx = new Date().getDay();
      const todayName = dayNamesMap[currentDayIdx];

      if (todayName) {
        activeDay = todayName;
        const btn = document.getElementById(`day-btn-${todayName}`);
        if (btn) btn.classList.add("today");
      }
      switchDayTab(activeDay);
    }

    // Fetch Routines from Cloud Firestore
    function fetchGroupRoutinesFromFirestore() {
      if (!db) {
        loadedRoutines["cst_7_2"] = SAMPLE_CST_7_2;
        populateGroupDropdown();
        renderActiveRoutine();
        return;
      }

      db.collection("routines").get().then((snapshot) => {
        loadedRoutines = {};
        if (!snapshot.empty) {
          snapshot.forEach(doc => {
            const data = doc.data();
            const codeKey = doc.id.toLowerCase().replace(/[^a-z0-9]/g, '_');
            loadedRoutines[codeKey] = data;
          });
        }
        
        if (Object.keys(loadedRoutines).length === 0) {
          loadedRoutines["cst_7_2"] = SAMPLE_CST_7_2;
        }

        populateGroupDropdown();
        renderActiveRoutine();
      }).catch((err) => {
        console.error("Firestore fetch error:", err);
        loadedRoutines["cst_7_2"] = SAMPLE_CST_7_2;
        populateGroupDropdown();
        renderActiveRoutine();
      });
    }

    // Populate Group Code Dropdown
    function populateGroupDropdown() {
      const dropdown = document.getElementById("group-select-dropdown");
      dropdown.innerHTML = "";

      Object.keys(loadedRoutines).forEach((key) => {
        const item = loadedRoutines[key];
        const codeName = item.group_short_code || key.toUpperCase();
        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = codeName;
        dropdown.appendChild(opt);
      });

      if (!loadedRoutines[activeGroupCode]) {
        activeGroupCode = Object.keys(loadedRoutines)[0];
      }
      dropdown.value = activeGroupCode;
    }

    // Handle Group Selection
    function onGroupSelected(val) {
      activeGroupCode = val;
      renderActiveRoutine();
    }

    // Switch Day Tab
    function switchDayTab(dayName) {
      activeDay = dayName;
      document.querySelectorAll(".day-tab-btn").forEach(btn => btn.classList.remove("active"));
      const activeBtn = document.getElementById(`day-btn-${dayName}`);
      if (activeBtn) activeBtn.classList.add("active");

      renderScheduleCards();
    }

    // Render Active Routine Data to Page
    function renderActiveRoutine() {
      const routine = loadedRoutines[activeGroupCode] || SAMPLE_CST_7_2;

      document.getElementById("info-group-title").textContent = routine.group_short_code || activeGroupCode.toUpperCase();
      document.getElementById("info-dept-sem").textContent = `${routine.department || 'Polytechnic Department'} • ${routine.semester || 'Semester Routine'}`;
      document.getElementById("info-load-tag").textContent = `Total Load: ${routine.total_load || 26} Periods/Week`;

      renderScheduleCards();
      renderTeacherDirectory(routine.teachers_details || []);
    }

    // Render Schedule Cards for Active Day
    function renderScheduleCards() {
      const routine = loadedRoutines[activeGroupCode] || SAMPLE_CST_7_2;
      const container = document.getElementById("period-cards-container");
      container.innerHTML = "";

      const daySchedule = (routine.weekly_schedule && routine.weekly_schedule[activeDay]) ? routine.weekly_schedule[activeDay] : [];

      if (!daySchedule || daySchedule.length === 0) {
        container.innerHTML = `
          <div class="period-card off-period" style="text-align: center; padding: 24px;">
            <i data-lucide="coffee" style="width: 28px; height: 28px; color: var(--text-muted); margin-bottom: 8px;"></i>
            <div style="font-weight: 700; color: var(--text-main);">No Classes Scheduled for ${activeDay}</div>
            <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">Enjoy your day off!</div>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      daySchedule.forEach(slot => {
        const isOff = !slot.subject_name;
        const card = document.createElement("div");
        card.className = `period-card ${isOff ? 'off-period' : ''}`;

        const teacherInfo = getTeacherByShortCode(routine.teachers_details, slot.teacher_short_code);

        card.innerHTML = `
          <div class="period-card-top">
            <div class="period-time-badge">
              <i data-lucide="clock" style="width: 13px; height: 13px;"></i>
              <span>${slot.period || 'Period'} • ${slot.time || ''}</span>
            </div>
            <div class="room-badge">
              <i data-lucide="map-pin" style="width: 13px; height: 13px;"></i>
              <span>Room: ${slot.room || '-'}</span>
            </div>
          </div>

          <div class="subject-title">${slot.subject_name ? slot.subject_name : 'No Class / Off Period'}</div>
          ${slot.subject_code ? `<div class="subject-code-tag">Subject Code: ${slot.subject_code}</div>` : ''}

          ${!isOff ? `
            <div class="period-teacher-row">
              <div class="teacher-code-name">
                <div class="teacher-avatar-mini">${slot.teacher_short_code || 'T'}</div>
                <span>${teacherInfo ? teacherInfo.name : (slot.teacher_short_code || 'Instructor')}</span>
              </div>
              <span style="color: var(--text-muted); font-size: 11px;">${teacherInfo ? teacherInfo.designation : ''}</span>
            </div>
          ` : ''}
        `;

        container.appendChild(card);
      });

      lucide.createIcons();
    }

    // Helper: Find Teacher by short code
    function getTeacherByShortCode(list, code) {
      if (!list || !code) return null;
      return list.find(t => t.short_code && t.short_code.toLowerCase() === code.toLowerCase());
    }

    // Render Teachers Directory List
    function renderTeacherDirectory(teachers) {
      const container = document.getElementById("teachers-list-container");
      container.innerHTML = "";

      if (!teachers || teachers.length === 0) {
        container.innerHTML = `<div style="font-size: 12px; color: var(--text-muted);">No teacher contact information available.</div>`;
        return;
      }

      teachers.forEach(t => {
        const item = document.createElement("div");
        item.className = "teacher-card-item";

        item.innerHTML = `
          <div class="teacher-info-group">
            <div class="teacher-avatar-big">${t.short_code || 'T'}</div>
            <div>
              <div class="teacher-name-title">
                <span>${t.name}</span>
                ${t.role ? `<span class="class-teacher-pill">${t.role}</span>` : ''}
              </div>
              <div class="teacher-desig">${t.designation || 'Instructor'}</div>
            </div>
          </div>
          ${t.phone_no ? `
            <a href="tel:${t.phone_no}" class="btn-call-teacher" title="Call ${t.name}">
              <i data-lucide="phone-call" style="width: 15px; height: 15px;"></i>
            </a>
          ` : ''}
        `;

        container.appendChild(item);
      });

      lucide.createIcons();
    }
  </script>
